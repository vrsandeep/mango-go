name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  GO_VERSION: '1.26.2'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            cc: gcc
          # Checkout the job for failure in case of arm64: https://github.com/vrsandeep/mango-go/actions/runs/18621453649/job/53093143044
          # - os: ubuntu-latest
          #   arch: arm64
          #   cc: aarch64-linux-gnu-gcc
          - os: macos-latest
            arch: amd64
            cc: clang
          - os: macos-latest
            arch: arm64
            cc: clang
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.arch == 'amd64' }}
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev make gcc libc6-dev

      - name: Install dependencies (Ubuntu arm64)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          # Ubuntu has ARM64 packages in an entirely different repo, so we can't just
          # `dpkg --add-architecture arm64` here: we have to add a custom sources.list first.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<EOF > /dev/null
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: jammy jammy-updates jammy-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Architectures: amd64

          Types: deb
          URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
          Suites: jammy jammy-updates jammy-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Architectures: arm64
          EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get update -y

          sudo apt-get install -y gcc-aarch64-linux-gnu \
            libc6-arm64-cross qemu-user-binfmt libc6:arm64 libsqlite3-dev make

      - name: Install macOS dependencies
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew update
          brew install sqlite

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Disabled to avoid cache poisoning on publish workflows.
          cache: false

      - name: Install esbuild
        run: npm install -g esbuild@0.28.1

      - name: Build assets
        run: make assets

      - name: Build binary
        run: |
          mkdir -p build
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "build/mango-go-${OS_NAME}-${ARCH}" \
            .
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          GOOS: ${{ matrix.os == 'ubuntu-latest' && 'linux' || 'darwin' }}
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}

      - name: Create release archive
        run: |
          tar -czf "build/mango-go-${OS_NAME}-${ARCH}.tar.gz" \
            "build/mango-go-${OS_NAME}-${ARCH}" \
            README.md LICENSE
        env:
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mango-go-${{ matrix.os }}-${{ matrix.arch }}
          path: build/mango-go-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Create checksums and rename files
        run: |
          mkdir -p renamed

          # Process each artifact directory
          for dir in mango-go-*; do
            if [ -d "$dir" ]; then
              # Extract OS and arch from directory name
              os_arch=$(echo "$dir" | sed 's/mango-go-//')
              os=$(echo "$os_arch" | cut -d'-' -f1-2)
              arch=$(echo "$os_arch" | cut -d'-' -f3)

              # Map to final names
              case "$os" in
                "ubuntu-latest")
                  final_name="mango-go-linux-$arch"
                  ;;
                "macos-latest")
                  if [ "$arch" = "amd64" ]; then
                    final_name="mango-go-macos-intel"
                  else
                    final_name="mango-go-macos-$arch"
                  fi
                  ;;
              esac

              # Move and create checksum
              mv "$dir"/*.tar.gz "renamed/$final_name.tar.gz"
              sha256sum "renamed/$final_name.tar.gz" >> checksums.txt
            fi
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            renamed/*.tar.gz \
            checksums.txt \
            --generate-notes \
            --title "$TAG_NAME"

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
