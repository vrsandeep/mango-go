<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Mango</title>
    <link rel="stylesheet" href="/static/css/ext/phosphor-icons.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/library.css">
</head>

<body>
    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle-btn"><i class="ph-bold ph-list"></i></button>
            <nav class="nav-links" id="nav-links">
                <div class="sidebar-logo">
                    <img src="/static/images/logo.svg" alt="Mango Logo" class="header-logo">
                </div>
                <a href="/">Home</a>
                <a href="/library">Library</a>
                <a href="/admin" class="admin-only" style="display: none;">Admin</a>
                <div class="header-dropdown">
                    <button class="header-dropdown-btn" tabindex="0">Download <i class="ph-bold ph-caret-down"></i></button>
                    <div class="header-dropdown-content">
                        <a href="/downloads/plugins">Plugins</a>
                        <hr>
                        <a href="/downloads/manager">Download Manager</a>
                        <a href="/downloads/subscriptions">Subscription Manager</a>
                    </div>
                </div>
            </nav>
        </div>
        <div class="header-right">
            <button id="search-btn" class="search-btn" title="Search folders"><i class="ph-bold ph-magnifying-glass"></i></button>
            <button id="theme-toggle-btn"><i class="ph-bold ph-sun"></i></button>
            <button id="logout-btn" class="auth-only" style="display: none;">Logout</button>
        </div>
    </header>
    <main class="container">
        <nav class="breadcrumb" id="breadcrumb-container"></nav>
        <div class="page-header">
            <img id="folder-thumb" class="header-thumb" style="display: none;">
            <h1 id="page-title">Library</h1>
            <div class="header-actions">
                <div class="rating-widget" id="rating-widget" style="display: none;" title="Rate this series">
                    <span class="rating-label">Rating:</span>
                    <div class="rating-stars" id="rating-stars"></div>
                    <button class="rating-clear-btn" id="rating-clear-btn" title="Clear rating">×</button>
                </div>
                <div class="progress-actions" id="progress-actions" style="display: none;">
                    <button id="mark-all-read-btn" class="action-btn" title="Mark all chapters as read">
                        <i class="ph-bold ph-check-circle"></i> All Read
                    </button>
                    <button id="mark-all-unread-btn" class="action-btn" title="Mark all chapters as unread">
                        <i class="ph-bold ph-circle"></i> All Unread
                    </button>
                </div>
                <button class="edit-btn" id="edit-folder-btn" style="display: none;" title="Edit Cover">
                    <i class="ph-bold ph-image"></i>
                </button>
            </div>
        </div>

        <!-- Inline tags — shown only when viewing a specific folder -->
        <div class="folder-tags-section" id="folder-tags-section" style="display: none;">
            <div class="inline-tags" id="tags-container"></div>
            <div class="inline-tag-input-wrap" id="inline-tag-input-wrap">
                <input type="text" id="tag-input" class="inline-tag-input" placeholder="+ Add tag…" autocomplete="off" title="Type a tag name and press Enter to save">
                <div class="autocomplete-suggestions" id="autocomplete-suggestions"></div>
            </div>
        </div>

        <span id="total-count" class="total-count"></span>
        <div class="library-controls">
            <div class="search-bar">
                <input type="search" id="search-input" placeholder="Search this folder...">
            </div>
            <div class="sort-controls">
                <span>Sort by:</span>
                <select id="sort-by">
                    <option value="auto">Auto</option>
                    <option value="name">Name</option>
                    <option value="created_at">Date Added</option>
                    <option value="updated_at">Date Modified</option>
                    <option value="progress">Progress</option>
                </select>
                <button id="sort-dir-btn">▲</button>
                <button id="unread-filter-btn" class="filter-btn" title="Show only unread">Unread</button>
            </div>
        </div>
        <div class="tag-filter-bar" id="tag-filter-bar" style="display: none;">
            <span class="tag-filter-label">Filter by tag:</span>
            <div class="tag-filter-chips" id="tag-filter-chips"></div>
        </div>
        <div class="grid" id="cards-grid"></div>
        <div class="pagination-container" id="pagination-container"></div>
    </main>

    <!-- Cover Upload Modal (cover only) -->
    <div class="modal-overlay" id="edit-folder-modal">
        <div class="modal-content modal-narrow">
            <div class="modal-header">
                <h2>Edit Cover</h2>
                <button class="modal-close-btn" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="file-upload-area">
                    <input type="file" id="cover-file-input" accept="image/png, image/jpeg, image/webp">
                    <label for="cover-file-input" class="file-upload-label">
                        <i class="ph-bold ph-upload"></i>
                        <span>Choose Cover Image</span>
                    </label>
                    <div class="selected-file-info" id="selected-file-info" style="display: none;">
                        <i class="ph-bold ph-file-image"></i>
                        <span class="file-name" id="file-name"></span>
                        <button type="button" class="remove-file-btn" id="remove-file-btn">
                            <i class="ph-bold ph-x"></i>
                        </button>
                    </div>
                </div>
                <button id="modal-save-btn" class="upload-btn">
                    <i class="ph-bold ph-upload"></i>
                    Upload Cover
                </button>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel-btn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="search-modal" id="search-modal">
        <div class="search-modal-content">
            <div class="search-input-container">
                <i class="ph-bold ph-magnifying-glass search-icon"></i>
                <input type="text" id="search-input-modal" class="search-input-modal" placeholder="Search folders by name..." autocomplete="off">
                <button class="search-close-btn" id="search-close-btn"><i class="ph-bold ph-x"></i></button>
            </div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <footer class="main-footer"><span id="version-footer"></span></footer>
    <script src="/static/js/header.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/library.js"></script>
</body>

</html>
